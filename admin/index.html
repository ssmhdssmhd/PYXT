<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/ssmhdssmhd/MXLOGO@main/favicon/favicon.ico">
    <title>管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            color: #1f2d3d;
            display: flex;
            min-height: 100vh;
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 220px;
            background: #001529;
            color: #c5c9d4;
            display: flex;
            flex-direction: column;
            transition: width .2s;
            position: sticky;
            top: 0;
            height: 100vh;
            flex: none;
            z-index: 10;
        }
        .sidebar.collapsed { width: 64px; }
        .sidebar .logo {
            height: 56px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 16px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255,255,255,.06);
            overflow: hidden;
            white-space: nowrap;
        }
        .sidebar .logo .badge { width: 34px; height: 34px; flex: none; border-radius: 9px; }
        .sidebar .logo .badge img { width: 100%; height: 100%; display: block; border-radius: 9px; }
        .sidebar .logo .t { overflow: hidden; text-overflow: ellipsis; }
        .sidebar .logo .t span { display: block; font-size: 12px; font-weight: 400; color: #8891a3; }

        .menu { flex: 1; overflow-y: auto; padding: 8px 0; }
        .menu::-webkit-scrollbar { width: 4px; }
        .menu::-webkit-scrollbar-thumb { background: #2a3a50; border-radius: 4px; }
        .menu .group {
            font-size: 12px;
            color: #66718a;
            padding: 12px 20px 6px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }
        .sidebar.collapsed .menu .group { text-align: center; padding: 12px 0 6px; }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            height: 42px;
            cursor: pointer;
            font-size: 14px;
            transition: background .15s, color .15s;
            position: relative;
            white-space: nowrap;
        }
        .menu-item:hover { background: rgba(255,255,255,.05); color: #fff; }
        .menu-item.active { background: #1677ff; color: #fff; }
        .menu-item svg { width: 18px; height: 18px; flex: none; }
        .menu-item .txt { overflow: hidden; text-overflow: ellipsis; }
        .sidebar.collapsed .menu-item .txt { display: none; }
        .menu-item .arrow { margin-left: auto; font-size: 12px; color: inherit; opacity: .7; }

        .submenu { background: #000c17; overflow: hidden; max-height: 0; transition: max-height .25s; }
        .submenu.open { max-height: 300px; }
        .submenu .menu-item { padding-left: 52px; height: 38px; font-size: 13px; color: #aab2c5; }
        .submenu .menu-item.active { background: rgba(22,119,255,.35); }
        .sidebar.collapsed .submenu { display: none; }

        /* ===== 主区域 ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .topbar {
            height: 56px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 1px 4px rgba(0,21,41,.08);
            position: sticky;
            top: 0;
            z-index: 5;
        }
        .topbar .left { display: flex; align-items: center; gap: 16px; }
        .icon-btn {
            width: 34px; height: 34px;
            border: none; border-radius: 8px;
            background: transparent;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: #5a6a7a;
            transition: background .15s;
        }
        .icon-btn:hover { background: #f0f2f5; }
        .icon-btn svg { width: 20px; height: 20px; }
        .crumb { font-size: 14px; color: #5a6a7a; }
        .crumb b { color: #1f2d3d; }

        .user-box { position: relative; display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
        .user-box:hover { background: #f0f2f5; }
        .user-box .avatar {
            width: 30px; height: 30px; border-radius: 50%;
            background: linear-gradient(135deg,#4096ff,#7fd0ff);
            color: #fff; font-size: 14px; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
        }
        .user-box .name { font-size: 13px; color: #1f2d3d; }
        .dropdown {
            position: absolute; right: 0; top: 44px;
            background: #fff; border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,.12);
            min-width: 140px; padding: 6px;
            display: none;
        }
        .dropdown.open { display: block; }
        .dropdown .item { padding: 9px 12px; font-size: 13px; border-radius: 6px; cursor: pointer; color: #1f2d3d; }
        .dropdown .item:hover { background: #f0f2f5; }
        .dropdown .item.danger { color: #d03050; }

        .content { flex: 1; padding: 20px; overflow-y: auto; }
        .page { display: none; animation: fade .25s; }
        .page.active { display: block; }
        @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        .page-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
        .page-desc { font-size: 13px; color: #8a94a6; margin-bottom: 20px; }

        .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
        .card {
            background: #fff; border-radius: 10px; padding: 20px;
            box-shadow: 0 1px 4px rgba(0,21,41,.06);
            display: flex; align-items: center; gap: 16px;
        }
        .card .ic {
            width: 48px; height: 48px; border-radius: 12px; flex: none;
            display: flex; align-items: center; justify-content: center;
        }
        .card .ic svg { width: 24px; height: 24px; }
        .card .num { font-size: 24px; font-weight: 700; color: #1f2d3d; }
        .card .lbl { font-size: 13px; color: #8a94a6; margin-top: 2px; }

        .panel {
            background: #fff; border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,21,41,.06);
            padding: 20px; margin-bottom: 16px;
        }
        .panel .h { font-size: 15px; font-weight: 600; margin-bottom: 16px; }

        .table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .table th { text-align: left; padding: 10px 12px; background: #fafbfc; color: #8a94a6; font-weight: 500; border-bottom: 1px solid #eff1f4; }
        .table td { padding: 12px; border-bottom: 1px solid #f2f4f7; color: #3b4151; }

        .status { padding: 2px 10px; border-radius: 4px; font-size: 12px; }
        .status.on { background: #e8f5ee; color: #1f9d61; }
        .status.off { background: #fde8e8; color: #d03050; }

        .placeholder {
            border: 2px dashed #d5dbe3; border-radius: 10px;
            padding: 60px 20px; text-align: center; color: #a0a8b5;
        }
        .empty-tip { margin-bottom: 8px; }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <span class="badge">
                <img src="https://cdn.jsdelivr.net/gh/ssmhdssmhd/MXLOGO@main/app/app-icon-mark-512-rounded.png" alt="logo">
            </span>
            <span class="t">解析服务后台<span>ADMIN</span></span>
        </div>
        <nav class="menu" id="menu"></nav>
    </aside>

    <div class="main">
        <div class="topbar">
            <div class="left">
                <button class="icon-btn" id="collapseBtn" title="折叠菜单">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </button>
                <div class="crumb">首页 / <b id="crumbTitle">仪表盘</b></div>
            </div>
            <div class="user-box" id="userBox">
                <div class="avatar" id="avatar">A</div>
                <div class="name" id="userName">admin</div>
                <div class="dropdown" id="dropdown">
                    <div class="item" id="logoutBtn">退出登录</div>
                </div>
            </div>
        </div>
        <div class="content" id="content"></div>
    </div>

    <script>
    (function () {
        var sidebar = document.getElementById('sidebar');
        var menuEl = document.getElementById('menu');
        var contentEl = document.getElementById('content');
        var crumbTitle = document.getElementById('crumbTitle');

        // 菜单配置（只需要这个轮子，加菜单改这里即可）
        var menus = [
            { id: 'dashboard', icon: 'home', text: '仪表盘', pages: { dashboard: '<div class="dashboard-page"></div>' } },
            { id: 'parse', icon: 'play', text: '解析服务', pages: {} },
            { id: 'proxy', icon: 'link', text: '媒体代理', pages: {} },
            { id: 'source', icon: 'source', text: '解析源管理', pages: {} },
            { id: 'system', icon: 'cog', text: '系统管理', children: [
                { id: 'user', text: '用户管理' },
                { id: 'role', text: '角色权限' },
                { id: 'log', text: '操作日志' }
            ]}
        ];

        var ICONS = {
            home: '<svg viewBox="0 0 24 24" fill="none"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
            play: '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="m10 9 5 3-5 3V9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
            link: '<svg viewBox="0 0 24 24" fill="none"><path d="M9 15 15 9M10.5 5.5 12 4a4.2 4.2 0 0 1 6 6l-2 2M13.5 18.5 12 20a4.2 4.2 0 0 1-6-6l2-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
            source: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M7 6l1.5 1.5M11 6l1.5 1.5" stroke="currentColor" stroke-linecap="round"/></svg>',
            cog: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'
        };

        function buildMenu() {
            var html = '';
            menus.forEach(function (m) {
                if (m.children && m.children.length) {
                    html += '<div class="group">' + m.text + '</div>';
                    var subActive = m.children.some(function (c) { return c.id === currentPage; });
                    html += '<div class="menu-item" data-sub="' + m.id + '" data-open="' + (subActive ? '1' : '') + '">'
                        + ICONS[m.icon] + '<span class="txt">' + m.text + '</span><span class="arrow">▾</span></div>';
                    html += '<div class="submenu' + (subActive ? ' open' : '') + '" id="sub-' + m.id + '">';
                    m.children.forEach(function (c) {
                        html += '<div class="menu-item' + (c.id === currentPage ? ' active' : '') + '" data-page="' + c.id + '"><span class="txt">' + c.text + '</span></div>';
                    });
                    html += '</div>';
                } else {
                    var pages = Object.keys(m.pages || {});
                    var pid = pages.length ? pages[0] : m.id;
                    html += '<div class="group"></div>';
                    html += '<div class="menu-item' + (pid === currentPage || m.id === currentPage ? ' active' : '') + '" data-page="' + pid + '">'
                        + ICONS[m.icon] + '<span class="txt">' + m.text + '</span></div>';
                }
            });
            menuEl.innerHTML = html;
            bindMenu();
        }

        function bindMenu() {
            menuEl.querySelectorAll('.menu-item[data-page]').forEach(function (el) {
                el.addEventListener('click', function (e) {
                    e.stopPropagation();
                    navTo(el.getAttribute('data-page'));
                });
            });
            menuEl.querySelectorAll('.menu-item[data-sub]').forEach(function (el) {
                el.addEventListener('click', function (e) {
                    var id = el.getAttribute('data-sub');
                    var sub = document.getElementById('sub-' + id);
                    var isOpen = sub.classList.toggle('open');
                    el.setAttribute('data-open', isOpen ? '1' : '');
                });
            });
        }

        var pages = {};
        function registry(id, render) { pages[id] = render; }

        registry('dashboard', function () {
            return '' +
                '<div class="page-title">仪表盘</div>' +
                '<div class="page-desc" id="healthDesc">加载中...</div>' +
                '<div class="cards">' +
                    card('play', '#e8f1fe', '#4096ff', '解析接口', '0', '在线') +
                    card('link', '#eafaf0', '#1f9d61', '媒体代理', '0', '已启用') +
                    card('source', '#fdf3e7', '#ff8f1f', '解析源', '0', '配置文件') +
                    card('cog', '#f1ebff', '#7b61ff', '系统运行', '0', '正常') +
                '</div>' +
                '<div class="panel"><div class="h">服务信息</div><table class="table"><tbody id="infoBody"></tbody></table></div>' +
                '<div class="panel"><div class="h">使用说明</div><div class="page-desc" style="margin:0">本后台为通用"轮子"框架（登录 + 侧边栏布局），业务功能页可在 <b>admin/index.html</b> 中按需扩展。</div></div>';
        });
        ['parse','proxy','source','user','role','log'].forEach(function (id) {
            registry(id, function () {
                var tips = {
                    parse: '此页面用于扩展视频解析任务管理',
                    proxy: '此页面用于扩展媒体代理与跨域配置',
                    source: '此页面用于扩展解析源配置管理',
                    user: '此页面用于扩展用户管理功能',
                    role: '此页面用于扩展角色权限管理',
                    log: '此页面用于扩展操作日志查询'
                };
                return '<div class="page-title">' + (tipTitle(id)) + '</div>' +
                    '<div class="page-desc">' + tips[id] + '</div>' +
                    '<div class="placeholder empty-tip">🚧 ' + tips[id] + '</div>';
            });
        });
        function tipTitle(id) { return { parse:'解析服务', proxy:'媒体代理', source:'解析源管理', user:'用户管理', role:'角色权限', log:'操作日志' }[id]; }

        function card(icon, bg, color, lbl, num, sub) {
            return '<div class="card"><div class="ic" style="background:' + bg + ';color:' + color + '">' +
                ICONS[icon] + '</div><div><div class="num" data-num>' + num + '</div><div class="lbl">' + lbl + '</div></div>' +
                '<div style="margin-left:auto;font-size:12px;color:#a0a8b5">' + sub + '</div></div>';
        }

        var currentPage = 'dashboard';
        function navTo(id) {
            currentPage = id;
            // 高亮
            menuEl.querySelectorAll('.menu-item[data-page]').forEach(function (el) {
                el.classList.toggle('active', el.getAttribute('data-page') === id);
            });
            var meta = tipTitle(id) || '仪表盘';
            crumbTitle.textContent = meta;
            contentEl.innerHTML = (pages[id] || pages.dashboard)();
            if (id === 'dashboard') loadHealth();
        }

        function loadHealth() {
            fetch('/api/health').then(function (r) { return r.json(); })
            .then(function (d) {
                var desc = document.getElementById('healthDesc');
                if (desc) { desc.textContent = '服务运行正常 · 版本 ' + d.version + ' · ' + d.service; }
                var body = document.getElementById('infoBody');
                if (body) {
                    var rows = [['状态', d.status], ['服务', d.service], ['版本', d.version], ['健康检查', 'GET /api/health']];
                    body.innerHTML = rows.map(function (r) {
                        return '<tr><td style="color:#8a94a6;width:160px">' + r[0] + '</td><td>' + r[1] + '</td></tr>';
                    }).join('');
                }
            }).catch(function () {
                var desc = document.getElementById('healthDesc');
                if (desc) desc.textContent = '服务信息加载失败';
            });
        }

        // 折叠
        document.getElementById('collapseBtn').addEventListener('click', function () {
            sidebar.classList.toggle('collapsed');
        });

        // 用户下拉
        var userBox = document.getElementById('userBox');
        var dropdown = document.getElementById('dropdown');
        userBox.addEventListener('click', function (e) { e.stopPropagation(); dropdown.classList.toggle('open'); });
        document.addEventListener('click', function () { dropdown.classList.remove('open'); });
        document.getElementById('logoutBtn').addEventListener('click', function () {
            fetch('/api/admin/logout', { method: 'POST' })
                .finally(function () { window.location.href = '/mx/login'; });
        });

        // 展示用户名（token 格式: base64url(payload).base64url(signature)，取第一部分）
        function b64urlDecode(str) {
            var b64 = str.replace(/-/g, '+').replace(/_/g, '/');
            while (b64.length % 4) b64 += '=';
            return atob(b64);
        }
        var u = (document.cookie.match(/pyxt_admin=([^;]+)/) || [])[1];
        if (u) {
            try {
                var payload = JSON.parse(b64urlDecode(u.split('.')[0]));
                if (payload && payload.u) {
                    document.getElementById('userName').textContent = payload.u;
                    document.getElementById('avatar').textContent = payload.u.charAt(0).toUpperCase();
                }
            } catch (e) {}
        }

        buildMenu();
        navTo('dashboard');
    })();
    </script>
</body>
</html>
