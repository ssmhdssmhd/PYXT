<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PYXT 视频播放页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f1115; color: #e8e8e8; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 16px; }
        .header { text-align: center; padding: 20px 0 12px; }
        .header h1 { font-size: 22px; color: #fff; }
        .video-info { background: #1a1d24; border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; font-size: 13px; line-height: 1.8; word-break: break-all; }
        .video-info strong { color: #4da3ff; }
        .video-info code { background: #252a35; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
        .player-section { margin-bottom: 14px; }
        .player-section h3 { font-size: 15px; margin-bottom: 8px; color: #9aa4b2; }
        .player-container { position: relative; width: 100%; background: #000; border-radius: 10px; overflow: hidden; }
        video { width: 100%; display: block; aspect-ratio: 16/9; background: #000; }
        .err-box { background: #3a1d1d; border: 1px solid #7a2d2d; color: #ff8a8a; padding: 12px 16px; border-radius: 8px; margin-top: 12px; font-size: 13px; word-break: break-all; }
        .loading { text-align: center; padding: 40px 0; color: #6b7480; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 PYXT 视频播放页</h1>
        </div>

        <div class="video-info" id="info"></div>

        <div class="player-section">
            <h3>🎥 播放区域</h3>
            <div class="player-container">
                <video id="video" controls playsinline preload="metadata"></video>
            </div>
            <div id="loading" class="loading" style="display:none;">⏳ 正在解析视频地址…</div>
        </div>

        <div id="err" class="err-box" style="display:none;"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
    <script>
        (function () {
            var params = new URLSearchParams(location.search);
            var direct = params.get('url');      // 播放直链 (m3u8/mp4)
            var pageUrl = params.get('video');   // 视频页面链接, 自动解析

            var video = document.getElementById('video');
            var info = document.getElementById('info');
            var errBox = document.getElementById('err');
            var loading = document.getElementById('loading');

            function showErr(msg) {
                errBox.style.display = 'block';
                errBox.textContent = msg;
            }
            function setInfo(html) {
                info.innerHTML = html;
            }
            function esc(s) {
                var d = document.createElement('div');
                d.textContent = s;
                return d.innerHTML;
            }

            // 所有媒体统一走本地代理, 规避第三方 CDN 跨域问题
            function play(mediaUrl) {
                var proxied = '/api/proxy?url=' + encodeURIComponent(mediaUrl);
                var isHls = /\.m3u8($|\?)/i.test(mediaUrl) || /m3u8/i.test(mediaUrl);
                if (isHls) {
                    if (window.Hls && Hls.isSupported()) {
                        var hls = new Hls({ maxBufferLength: 60, enableWorker: true });
                        hls.loadSource(proxied);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.ERROR, function (e, data) {
                            if (data && data.fatal) {
                                showErr('HLS 播放错误: ' + (data.details || ''));
                            }
                        });
                        video.play().catch(function () {});
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = proxied;
                        video.play().catch(function () {});
                    } else {
                        showErr('当前浏览器不支持 HLS(m3u8) 播放');
                    }
                } else {
                    video.src = proxied;
                    video.play().catch(function () {});
                }
            }

            if (direct) {
                setInfo('<p><strong>播放直链:</strong> ' + esc(direct) + '</p>');
                play(direct);
            } else if (pageUrl) {
                setInfo('<p><strong>视频页面:</strong> ' + esc(pageUrl) + '</p>');
                loading.style.display = 'block';
                fetch('/api/parse?url=' + encodeURIComponent(pageUrl))
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        loading.style.display = 'none';
                        if (d.code === 200 && d.url) {
                            setInfo('<p><strong>视频标题:</strong> ' + esc(d.title || '未知') + '</p>' +
                                '<p><strong>视频页面:</strong> ' + esc(pageUrl) + '</p>' +
                                '<p><strong>播放地址:</strong> ' + esc(d.url) + '</p>');
                            play(d.url);
                        } else {
                            showErr('解析失败: ' + esc(d.msg || '未知错误'));
                        }
                    })
                    .catch(function (e) {
                        loading.style.display = 'none';
                        showErr('解析请求失败: ' + esc(e.message));
                    });
            } else {
                setInfo('<p><strong>用法:</strong> 页面链接后追加参数即可播放, 无需硬编码地址</p>' +
                    '<p><code>?url=&lt;m3u8/mp4 直链&gt;</code> 直接播放直链(自动走代理, 跨域无忧)</p>' +
                    '<p><code>?video=&lt;视频页面链接&gt;</code> 自动解析后播放</p>' +
                    '<p>示例: /video_player.html?url=https://example.com/a.m3u8</p>');
            }
        })();
    </script>
</body>
</html>
